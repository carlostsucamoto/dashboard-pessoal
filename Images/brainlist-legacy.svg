<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2f" />
      <stop offset="100%" stop-color="#2c2c3e" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <linearGradient id="stampGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" rx="16" fill="url(#bgGradient)" />

  <!-- Grid lines subtle texture -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
  </g>

  <!-- Retro Stamp Badge: Semana 1 FIAP -->
  <g transform="translate(620, 24)">
    <rect width="156" height="32" rx="16" fill="url(#stampGrad)" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="3 3" />
    <text x="78" y="20" fill="#fbbf24" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.5">SEMANA 1 FIAP • 2026</text>
  </g>

  <!-- Header Section -->
  <g transform="translate(400, 75)" text-anchor="middle" font-family="Inter, system-ui, sans-serif">
    <!-- Title -->
    <text x="0" y="0" fill="#ffffff" font-size="28" font-weight="700" letter-spacing="-0.5">Central de ideias</text>
    <!-- Subtitle -->
    <text x="0" y="24" fill="#cbd5e1" font-size="13" font-weight="400" opacity="0.75">Carlos Eduardo Tsucamoto Chiarelli</text>
    <!-- Description -->
    <text x="0" y="44" fill="#94a3b8" font-size="12" font-weight="400" opacity="0.85">Um dashboard pessoal para organização de estudos, projetos, ideias e rotina.</text>
  </g>

  <!-- Nav Buttons (5 Original Nav Links) -->
  <g transform="translate(400, 160)" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">
    <!-- Backlog -->
    <g transform="translate(-270, 0)">
      <rect x="-48" y="0" width="96" height="36" rx="8" fill="#2a2a3d" stroke="#3b3b54" stroke-width="1" />
      <text x="0" y="22" fill="#ffffff">Backlog</text>
    </g>
    <!-- Estudos -->
    <g transform="translate(-135, 0)">
      <rect x="-48" y="0" width="96" height="36" rx="8" fill="#2a2a3d" stroke="#3b3b54" stroke-width="1" />
      <text x="0" y="22" fill="#ffffff">Estudos</text>
    </g>
    <!-- Projetos (Active Hover state look) -->
    <g transform="translate(0, 0)">
      <rect x="-48" y="0" width="96" height="36" rx="8" fill="#4c4cf8" filter="url(#cardShadow)" />
      <text x="0" y="22" fill="#ffffff">Projetos</text>
    </g>
    <!-- Sobre mim -->
    <g transform="translate(135, 0)">
      <rect x="-52" y="0" width="104" height="36" rx="8" fill="#2a2a3d" stroke="#3b3b54" stroke-width="1" />
      <text x="0" y="22" fill="#ffffff">Sobre mim</text>
    </g>
    <!-- Ideias -->
    <g transform="translate(270, 0)">
      <rect x="-48" y="0" width="96" height="36" rx="8" fill="#2a2a3d" stroke="#3b3b54" stroke-width="1" />
      <text x="0" y="22" fill="#ffffff">Ideias</text>
    </g>
  </g>

  <!-- Central Card Box: Escolha uma das seções acima para começar -->
  <g transform="translate(170, 230)">
    <rect width="460" height="180" rx="16" fill="#2a2a3d" stroke="#4c4cf8" stroke-width="1.5" stroke-opacity="0.6" filter="url(#cardShadow)" />
    
    <!-- Subtle Icon in Card -->
    <g transform="translate(230, 60)" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-18" y="-18" width="36" height="36" rx="8" stroke="#4c4cf8" fill="#1e1e2f" fill-opacity="0.5" />
      <path d="M-6 -6 L6 6 M6 -6 L-6 6" opacity="0.3" />
      <circle cx="0" cy="0" r="4" fill="#818cf8" stroke="none" />
    </g>

    <text x="230" y="115" fill="#e2e8f0" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="500" text-anchor="middle">
      Escolha uma das seções acima para começar.
    </text>
    <text x="230" y="140" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" opacity="0.7">
      HTML5 • CSS3 Vanilla • Primeira Semana de ADS na FIAP
    </text>
  </g>

  <!-- Footer Tag -->
  <text x="400" y="465" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">
    © 2026 Carlos Eduardo Tsucamoto Chiarelli • Preservado em /legacy
  </text>
</svg>
